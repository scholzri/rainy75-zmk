# Application configuration for Rainy 75 Pro (ZMK firmware)
# Applied via: -DEXTRA_CONF_FILE=$(pwd)/conf/app.conf

CONFIG_ZMK_KEYBOARD_NAME="Rainy 75 Pro"

# ── USB ──────────────────────────────────────────────────────────────────────
CONFIG_USB_DC_B91=y
CONFIG_ZMK_USB=y

# True USB remote wakeup: advertise the capability (bmAttributes bit 5, same as
# stock firmware), track the host's SET_FEATURE(DEVICE_REMOTE_WAKEUP), and let
# a suspended keypress drive resume signaling via usb_dc_wakeup_request()
# (WAKEUPEN 0x1401ee pulse, Telink SDK usb_hardware_remote_wakeup recipe)
# instead of re-presenting the device. Issue #19.
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y

# Every usb_transfer completion runs on the USB workqueue thread, as do the CDC
# and SMP transport callbacks. Zephyr's 1024-byte default leaves little headroom
# for that stack, and an overflow there presents exactly like the CDC wedge
# chased in #18: transfers stop completing, the console dies in both directions,
# HID keeps working and the host still sees a healthy device.
CONFIG_USB_WORKQUEUE_STACK_SIZE=2048

# Recover a dead USB bus while suspended. The B91 has no VBUS-detect pin, so on
# host/cable removal USB parks in SUSPEND and — left there for hours — misses the
# returning host's bus reset, leaving the keyboard dead until it is re-plugged.
# This re-presents the device only when the bus is provably dead (silent while
# configured, silent while the host sleeps, recovery-on-keypress instead), so it
# never dark-wakes a sleeping host or disturbs a shared hub. Provided by
# patches/zmk-src/0002 and requires the B91 driver's suspend/resume delivery.
CONFIG_ZMK_USB_SUSPEND_REATTACH=y

# ── Logging ──────────────────────────────────────────────────────────────────
# The log goes to the console CDC ACM port it shares with mcumgr DFU
# (conf/mcumgr.overlay); ZMK Studio has its own port, see "ZMK Studio" below.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
# The default 768 B log thread stack was 99 % used (open link layer build,
# mcumgr taskstat); measured peak 824 B with 1024 B (thread analyzer).
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y

# ── MCUboot DFU ──────────────────────────────────────────────────────────────
# USB UART (primary) + BLE SMP (backup).
# USB:  mcumgr --conntype serial --connstring "dev=/dev/ttyACM0,baud=115200" image upload build/zephyr/zmk.signed.bin
CONFIG_BOOTLOADER_MCUBOOT=y
# Release version, baked into the MCUboot image header (imgtool --version) so
# `mcumgr image list` reports which release a keyboard is running instead of
# 0.0.0. Bump to the NEXT release version as the first commit of each release
# cycle (tag v0.1.1 ships the tree where this says "0.1.1").
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.4.0"
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=8
# The log fills the 4 KB CDC TX ring while no host reads the port (the boot
# log alone does); poll_out() then discarded the first SMP response after the
# port was opened (first mcumgr command after boot: NMP timeout). Wait for the
# host to drain the ring instead (zephyr patch 0011).
CONFIG_UART_MCUMGR_TX_WAIT_MS=500

# ── BLE ──────────────────────────────────────────────────────────────────────
# Controller: the open link layer by default (conf/openll.conf); --blob selects
# the Telink blob (liblt_9518_zephyr.a, 2.8 MB). Blob: 1M PHY only, the
# blob's 2M PHY causes LL Response Timeout 0x22 after 40s.
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HCI_B91=y
CONFIG_BT_HCI_B91_RX_STACK_SIZE=2048
CONFIG_ZMK_BLE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
# Passkey Entry: host displays 6-digit code, type it on the keyboard.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
# BLE privacy: DISABLED here (keeps the public identity, so bonds survive).
# With the open controller use ./build.sh --privacy (conf/privacy.conf), which
# needs every host to be paired again. The old "privacy hangs bt_enable() with
# the blob" was most likely the ZMK settings deadlock fixed by zmk-src 0005; the
# blob was not retested, so --privacy stays open-controller only.
# CONFIG_BT_PRIVACY=y

# ── HID indicators (CapsLock/NumLock LED feedback) ───────────────────────────
CONFIG_ZMK_HID_INDICATORS=y

# ── RGB Underglow ────────────────────────────────────────────────────────────
# 83 WS2812 per-key LEDs via PSPI + DMA on PB7. PC2 HIGH = LED VCC MOSFET.
# ZMK built-in underglow is OFF — rainy_rgb behavior handles RGB directly.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP_B91_SPI_PC2_POWER=y
CONFIG_RAINY_RGB=y
# LED idle off/dim is the runtime setting rgb.idle_s / rgb.idle_mode (default
# never). ZMK's own activity idle (battery sampling pauses) stays at 60 s.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ── Battery ADC ──────────────────────────────────────────────────────────────
# PD1 = battery voltage via 1/2 resistor divider (ADC channel 0x0A).
CONFIG_BATTERY_B91_ADC=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ── Deep Sleep ───────────────────────────────────────────────────────────────
# sys_poweroff → DEEPSLEEP_MODE (0x30, cold boot). Wakeup on any keypress.
# Retention mode (0x03) incompatible with MCUboot (boot ROM overwrites ILM).
# The trigger is ours (zmk/src/sleep/, CONFIG_RAINY75_SLEEP), not ZMK's: after
# kb.sleep_min minutes (runtime setting, default 15, 0 = never) without a key or
# a settings change, and not while a USB host is connected unless kb.sleep_on_usb.
CONFIG_ZMK_SLEEP=n
CONFIG_RAINY75_SLEEP=y
# Fallback to ZMK's own sleep (15 min, also on USB; kb.sleep_* then do nothing):
# use the three lines below instead of the two above. ZMK_USB_NO_VBUS_DETECT
# (patches/zmk-src/0001, exists only with ZMK_SLEEP) makes ZMK's check ignore USB
# power: the B91 has no VBUS-detect pin, USB never reports a disconnect, and
# without it ZMK's sleep never fires on battery.
#CONFIG_ZMK_SLEEP=y
#CONFIG_RAINY75_SLEEP=n
#CONFIG_ZMK_USB_NO_VBUS_DETECT=y

# ── ZMK Studio ───────────────────────────────────────────────────────────────
# Runtime keymap editing via https://zmk.studio, over BLE (WebBluetooth) and over
# USB (WebSerial). Unlock: press Fn+ESC. Both transports answer regardless of the
# selected output (patches/zmk-src/0008); a change of transport locks Studio.
#
# USB Studio is a second CDC ACM port (conf/studio-usb.overlay, added by build.sh)
# next to the console/mcumgr port. It fits the B91's 256 B USB SRAM only with 32 B
# bulk endpoints (board Kconfig.defconfig sets CDC_ACM_BULK_EP_MPS to 32 when the
# Studio port exists): 2 x (64 B bulk OUT + 32 B bulk IN + 16 B notify) + 16 B HID
# = 240 B. It runs on EP6/EP7, which the hardware resets into isochronous mode;
# the USB driver sets the mode from the endpoint type.
CONFIG_UART_LINE_CTRL=y
CONFIG_ZMK_STUDIO=y
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=64

# ── Raw flash management (for firmware restore) ──────────────────────────
CONFIG_FLASH_MGMT=y

# ── Host-controlled per-key RGB via mcumgr (group 65) ────────────────────
CONFIG_RGB_MGMT=y
# Runtime settings over mcumgr group 67 (docs/config-protocol.md)
CONFIG_RAINY75_CONFIG=y

# ── Stack diagnostics ───────────────────────────────────────────────────────
# The B91 has no PMP stack guard, so a thread stack overflow faults nothing: it
# silently corrupts the neighbouring stack (the rainy_rgb dark-strip hang, #29).
# STACK_SENTINEL checks a canary at the stack base on every context switch and
# ISR exit; a hit goes through k_sys_fatal_error_handler, which here means a
# logged cold reboot instead of a hang. INIT_STACKS paints stacks at creation so
# k_thread_stack_space_get() works, which is what the rgb_mgmt info command's
# "sfree" field reads; without it the field is always 0.
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y

# ── Debug (disabled for production) ─────────────────────────────────────────
# Boot diagnostic (.noinit SRAM buffer + PA7 SWS restore + GPIO markers)
CONFIG_BOOT_DIAG=y
# Kscan polling fallback (GPIO interrupts work with patches 0001+0002)
# CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
