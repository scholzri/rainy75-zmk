# Upstream patches of this workspace, for Zephyr's `west patch`
# (schema: zephyr/scripts/schemas/patch-schema.yml).
#
# The patch files stay in <workspace>/patches/<repo>/, so every call needs the
# patch base relative to this module (zmk/):
#
#     west update && west patch -b ../patches apply
#
# build.sh applies them itself (only the ones whose commit subject is missing
# in the tree, through `west patch` with a filtered copy of this file); see
# docs/zmk-firmware.md "Applying the patches".
#
# module: path relative to the west workspace (not the west project name: the
# ZMK project is named "zmk", which is also the directory of this module).
# apply-command: git am, so every patch becomes a commit with its own subject;
# that subject is how build.sh recognises an applied patch.
# After editing a patch file, update its sha256sum (sha256sum patches/...).

# `west patch clean` moves each patched tree back to the revision of the last
# `west update`. That drops our patch commits (they live in the patch files,
# and in the reflog) and refuses to run over conflicting uncommitted changes.
# The upstream defaults ("git checkout ." and "git clean -d -f -x") would
# instead discard uncommitted work and keep the patch commits.
checkout-command: git checkout --detach manifest-rev
clean-command: ""

