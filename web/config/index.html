<!--
  The Rainy 75 config page: one self-contained file (no libraries, fonts or
  network; the Content Security Policy above blocks every request). It talks
  to the keyboard over mcumgr group 67 (docs/config-protocol.md), over USB
  (Web Serial) or Bluetooth (Web Bluetooth). Sections, in this order: SMP +
  CBOR, USB transport, Bluetooth transport, config model, simulated keyboard
  (?demo), labels and help, UI. The script sections marked data-core touch no
  browser API when they load, so test-node.mjs and test.html can run them.
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6f8; --fg: #1a1c20; --muted: #555d6b; --card: #ffffff; --line: #d8dce2;
  --accent: #1f56d1; --accent-fg: #ffffff; --focus: #1f56d1;
  --info-bg: #e8effd; --info-fg: #173b8c; --warn-bg: #fff3d1; --warn-fg: #5f4300;
  --err-bg: #fde7e7; --err-fg: #861b1b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --fg: #e6e8ec; --muted: #a3aab6; --card: #1d2026; --line: #343943;
    --accent: #7ea4ff; --accent-fg: #0b1222; --focus: #9cbaff;
    --info-bg: #182844; --info-fg: #c7d8ff; --warn-bg: #3a2e0e; --warn-fg: #ffd98c;
    --err-bg: #3e1818; --err-fg: #ffb8b8;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--fg); background: var(--bg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

<!-- Section: SMP + CBOR -->
<script data-core id="smp">
"use strict";
(() => {
  const C = (globalThis.RainyCore = globalThis.RainyCore || {});

  /* CBOR (RFC 8949), the subset SMP needs: unsigned and negative integers,
   * byte and text strings, arrays, maps, false, true, null. Requests are
   * always definite length; replies may use indefinite-length arrays and maps
   * (zcbor writes them so), the decoder accepts both. */
  const utf8 = new TextEncoder();
  const utf8In = new TextDecoder("utf-8", { fatal: true });

  function cborHead(out, major, n) {
    if (!Number.isInteger(n) || n < 0 || n > 0xffffffff) {
      throw new RangeError("CBOR: value out of range: " + n);
    }
    const m = major << 5;
    if (n < 24) out.push(m | n);
    else if (n < 0x100) out.push(m | 24, n);
    else if (n < 0x10000) out.push(m | 25, n >> 8, n & 255);
    else out.push(m | 26, n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255);
  }

  function cborItem(out, v, indef) {
    if (v === false) out.push(0xf4);
    else if (v === true) out.push(0xf5);
    else if (v === null) out.push(0xf6);
    else if (typeof v === "number") {
      if (!Number.isInteger(v)) throw new TypeError("CBOR: not an integer: " + v);
      if (v >= 0) cborHead(out, 0, v);
      else cborHead(out, 1, -1 - v);
    } else if (typeof v === "string") {
      const b = utf8.encode(v);
      cborHead(out, 3, b.length);
      for (const x of b) out.push(x);
    } else if (ArrayBuffer.isView(v)) {
      const b = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
      cborHead(out, 2, b.length);
      for (const x of b) out.push(x);
    } else if (Array.isArray(v)) {
      if (indef) out.push(0x9f);
      else cborHead(out, 4, v.length);
      for (const x of v) cborItem(out, x, indef);
      if (indef) out.push(0xff);
    } else if (typeof v === "object") {
      const keys = Object.keys(v);
      if (indef) out.push(0xbf);
      else cborHead(out, 5, keys.length);
      for (const k of keys) {
        cborItem(out, k, indef);
        cborItem(out, v[k], indef);
      }
      if (indef) out.push(0xff);
    } else {
      throw new TypeError("CBOR: cannot encode " + typeof v);
    }
  }

  /* value -> bytes. opts.indefinite writes arrays and maps with indefinite
   * length (the simulated keyboard answers so, as the firmware does). */
  function cborEncode(v, opts) {
    const out = [];
    cborItem(out, v, !!(opts && opts.indefinite));
    return Uint8Array.from(out);
  }

  /* bytes -> value. Maps become plain objects, byte strings Uint8Array.
   * Throws on truncated input, trailing bytes, tags, floats and
   * indefinite-length strings. */
  function cborDecode(d) {
    let p = 0;
    const need = (n) => {
      if (p + n > d.length) throw new Error("CBOR: truncated");
    };
    const arg = (minor) => {
      if (minor < 24) return minor;
      const len = { 24: 1, 25: 2, 26: 4, 27: 8 }[minor];
      if (!len) throw new Error("CBOR: bad length field " + minor);
      need(len);
      let n = 0;
      for (let i = 0; i < len; i++) n = n * 256 + d[p++];
      if (!Number.isSafeInteger(n)) throw new Error("CBOR: integer too large");
      return n;
    };
    const item = (depth) => {
      if (depth > 16) throw new Error("CBOR: nested too deep");
      need(1);
      const ib = d[p++];
      const major = ib >> 5;
      const minor = ib & 31;
      if (major === 0) return arg(minor);
      if (major === 1) return -1 - arg(minor);
      if (major === 2 || major === 3) {
        if (minor === 31) throw new Error("CBOR: indefinite-length string");
        const n = arg(minor);
        need(n);
        const s = d.slice(p, p + n);
        p += n;
        return major === 2 ? s : utf8In.decode(s);
      }
      if (major === 4 || major === 5) {
        const indef = minor === 31;
        const n = indef ? Infinity : arg(minor);
        const out = major === 4 ? [] : {};
        for (let i = 0; i < n; i++) {
          need(1);
          if (indef && d[p] === 0xff) {
            p++;
            break;
          }
          if (major === 4) {
            out.push(item(depth + 1));
            continue;
          }
          const k = item(depth + 1);
          if (typeof k !== "string" && typeof k !== "number") throw new Error("CBOR: map key type");
          const v = item(depth + 1);
          if (k !== "__proto__") out[k] = v;
        }
        return out;
      }
      if (major === 7) {
        if (minor === 20) return false;
        if (minor === 21) return true;
        if (minor === 22 || minor === 23) return null;
        throw new Error("CBOR: unsupported simple value " + minor);
      }
      throw new Error("CBOR: unsupported major type " + major);
    };
    const v = item(0);
    if (p !== d.length) throw new Error("CBOR: trailing bytes");
    return v;
  }

  /* SMP (mcumgr) frame: an 8-byte header (op, flags, payload length, group,
   * sequence number, command; big-endian), then the CBOR payload. The version
   * bits stay 0 (SMP v1), as reverse/tools/restore_original.py sends. */
  const SMP = { READ: 0, WRITE: 2, HDR: 8, GROUP_OS: 0, GROUP_IMG: 1, GROUP_CFG: 67 };

  function smpFrame(op, group, cmd, seq, payload) {
    if (payload.length > 0xffff) throw new RangeError("SMP: payload too large");
    const f = new Uint8Array(SMP.HDR + payload.length);
    f.set([op & 7, 0, payload.length >> 8, payload.length & 255, group >> 8, group & 255, seq & 255, cmd & 255]);
    f.set(payload, SMP.HDR);
    return f;
  }

  function smpRequest(op, group, cmd, seq, body) {
    return smpFrame(op, group, cmd, seq, cborEncode(body));
  }

  function smpParse(frame) {
    if (frame.length < SMP.HDR) throw new Error("SMP: frame too short");
    const len = (frame[2] << 8) | frame[3];
    if (frame.length < SMP.HDR + len) throw new Error("SMP: frame shorter than its header says");
    return {
      op: frame[0] & 7,
      flags: frame[1],
      len,
      group: (frame[4] << 8) | frame[5],
      seq: frame[6],
      cmd: frame[7],
      body: len ? cborDecode(frame.subarray(SMP.HDR, SMP.HDR + len)) : {},
    };
  }

  Object.assign(C, { cborEncode, cborDecode, SMP, smpFrame, smpRequest, smpParse });

  /* DeviceError: the keyboard answered with a non-zero rc. TransportError: no
   * answer (after the retry), the link closed, or a write failed; the page
   * then reports the connection as lost. */
  class DeviceError extends Error {
    constructor(rc) {
      super("the keyboard refused the request (rc " + rc + ")");
      this.name = "DeviceError";
      this.rc = rc;
    }
  }

  class TransportError extends Error {
    constructor(message) {
      super(message);
      this.name = "TransportError";
    }
  }

  /* One request at a time over a transport: {send(frame) -> Promise, onPacket,
   * onClose, close()}; the transport calls onPacket(frame) for every SMP frame
   * it receives and onClose(err) when the link goes away. A reply matches by
   * op, group, command and the sequence number of any attempt of the request,
   * so a late answer to the first attempt still counts. timeoutMs per attempt
   * (2 s USB, 5 s Bluetooth), retries more attempts (1). */
  class SmpClient {
    constructor(transport, opts) {
      this.transport = transport;
      this.timeoutMs = opts.timeoutMs;
      this.retries = opts.retries === undefined ? 1 : opts.retries;
      this.seq = 0;
      this.queue = Promise.resolve();
      this.waiting = null;
      this.closed = false;
      this.onClose = null;
      transport.onPacket = (frame) => this._packet(frame);
      transport.onClose = (err) => this._lost(err);
    }

    /* -> the reply body; opts {timeoutMs, retries} override the defaults. */
    request(op, group, cmd, body, opts) {
      const run = () => this._request(op, group, cmd, body || {}, opts || {});
      const p = this.queue.then(run, run);
      this.queue = p.catch(() => {});
      return p;
    }

    async _request(op, group, cmd, body, opts) {
      const timeoutMs = opts.timeoutMs === undefined ? this.timeoutMs : opts.timeoutMs;
      const retries = opts.retries === undefined ? this.retries : opts.retries;
      const seqs = [];
      for (let attempt = 0; attempt <= retries; attempt++) {
        if (this.closed) throw new TransportError("not connected");
        const seq = this.seq;
        this.seq = (this.seq + 1) & 255;
        seqs.push(seq);
        let timer;
        const answer = new Promise((resolve) => {
          this.waiting = { op: op + 1, group, cmd, seqs, resolve };
          timer = setTimeout(() => resolve(null), timeoutMs);
        });
        try {
          await this.transport.send(smpRequest(op, group, cmd, seq, body));
        } catch (e) {
          clearTimeout(timer);
          this.waiting = null;
          throw new TransportError("sending failed: " + ((e && e.message) || e));
        }
        const msg = await answer;
        clearTimeout(timer);
        this.waiting = null;
        if (msg && msg.closed) throw new TransportError("the connection closed");
        if (msg) {
          const b = msg.body && typeof msg.body === "object" ? msg.body : {};
          const rc = typeof b.rc === "number" ? b.rc : (b.err && b.err.rc) || 0;
          if (rc) throw new DeviceError(rc);
          return b;
        }
      }
      throw new TransportError("no answer from the keyboard");
    }

    _packet(frame) {
      const w = this.waiting;
      if (!w) return;
      let msg;
      try {
        msg = smpParse(frame);
      } catch (e) {
        return;
      }
      if (msg.op !== w.op || msg.group !== w.group || msg.cmd !== w.cmd || !w.seqs.includes(msg.seq)) return;
      w.resolve(msg);
    }

    _lost(err) {
      if (this.closed) return;
      this.closed = true;
      if (this.waiting) this.waiting.resolve({ closed: true });
      if (this.onClose) this.onClose(err);
    }

    /* The page ends the link itself: no onClose. */
    close() {
      this.closed = true;
      if (this.waiting) this.waiting.resolve({ closed: true });
    }
  }

  Object.assign(C, { DeviceError, TransportError, SmpClient });
  // end of SMP + CBOR
})();
</script>
<!-- Section: USB transport -->
<script data-core id="usb">
"use strict";
(() => {
  const C = globalThis.RainyCore;

  /* SMP over the console serial port, the framing of Zephyr's mcumgr serial
   * transport (as reverse/tools/restore_original.py does it): length (2 bytes,
   * big-endian: packet + CRC), packet, CRC16-XMODEM of the packet (big-endian),
   * base64, cut into lines of at most 127 bytes. The first line starts with
   * 0x06 0x09, the others with 0x04 0x14, each ends with "\n". The same port
   * carries the plain-text Zephyr log: a line without a frame marker is log
   * text and is skipped (as rainy75_dfu.py does). */
  const SERIAL_LINE_MAX = 127;
  const B64_PER_LINE = SERIAL_LINE_MAX - 3; /* 124: 2 marker bytes and "\n" */
  const LINE_LIMIT = 4096; /* longer lines are cut (log noise) */

  function crc16(data, crc = 0) {
    for (const b of data) {
      crc ^= b << 8;
      for (let i = 0; i < 8; i++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
    }
    return crc;
  }

  function b64encode(data) {
    let s = "";
    for (let i = 0; i < data.length; i += 0x8000) s += String.fromCharCode.apply(null, data.subarray(i, i + 0x8000));
    return btoa(s);
  }

  function b64decode(text) {
    const s = atob(text);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  /* SMP packet -> the lines to write, each a Uint8Array. */
  function serialEncode(packet) {
    const full = new Uint8Array(packet.length + 4);
    const n = packet.length + 2;
    const crc = crc16(packet);
    full[0] = n >> 8;
    full[1] = n & 255;
    full.set(packet, 2);
    full[full.length - 2] = crc >> 8;
    full[full.length - 1] = crc & 255;
    const b64 = b64encode(full);
    const lines = [];
    for (let i = 0; i < b64.length; i += B64_PER_LINE) {
      const chunk = b64.slice(i, i + B64_PER_LINE);
      const line = new Uint8Array(chunk.length + 3);
      line[0] = i === 0 ? 0x06 : 0x04;
      line[1] = i === 0 ? 0x09 : 0x14;
      for (let j = 0; j < chunk.length; j++) line[2 + j] = chunk.charCodeAt(j);
      line[line.length - 1] = 0x0a;
      lines.push(line);
    }
    return lines;
  }

  /* Received bytes -> SMP packets. push() takes any chunk (lines may be split
   * anywhere) and returns the packets completed by it. Each line's base64 is
   * decoded on its own, as Zephyr does; a frame with a bad CRC or bad base64
   * is dropped (badFrames), log lines are counted (logLines). */
  class SerialDecoder {
    constructor() {
      this.line = [];
      this.frame = null;
      this.logLines = 0;
      this.badFrames = 0;
    }

    push(chunk) {
      const out = [];
      for (const b of chunk) {
        if (b === 0x0a) {
          const packet = this._line(this.line);
          this.line = [];
          if (packet) out.push(packet);
        } else if (this.line.length < LINE_LIMIT) {
          this.line.push(b);
        }
      }
      return out;
    }

    _line(bytes) {
      let n = bytes.length;
      if (n > 0 && bytes[n - 1] === 0x0d) n--;
      const first = n >= 2 && bytes[0] === 0x06 && bytes[1] === 0x09;
      const cont = n >= 2 && bytes[0] === 0x04 && bytes[1] === 0x14;
      if (!first && !cont) {
        this.logLines++;
        return null;
      }
      if (cont && !this.frame) {
        this.badFrames++;
        return null;
      }
      let data;
      try {
        data = b64decode(String.fromCharCode.apply(null, bytes.slice(2, n)));
      } catch (e) {
        this.frame = null;
        this.badFrames++;
        return null;
      }
      if (first) {
        this.frame = data;
      } else {
        const joined = new Uint8Array(this.frame.length + data.length);
        joined.set(this.frame);
        joined.set(data, this.frame.length);
        this.frame = joined;
      }
      const buf = this.frame;
      if (buf.length < 2) return null;
      const len = (buf[0] << 8) | buf[1]; /* packet + CRC */
      if (buf.length - 2 < len) return null; /* more lines to come */
      this.frame = null;
      if (buf.length - 2 > len || len < 2 || crc16(buf.subarray(2, 2 + len)) !== 0) {
        this.badFrames++;
        return null;
      }
      return buf.slice(2, len);
    }
  }

  Object.assign(C, { SERIAL_LINE_MAX, crc16, b64encode, b64decode, serialEncode, SerialDecoder });
  // end of USB transport
})();
</script>
<!-- Section: Bluetooth transport -->
<script data-core id="ble">
"use strict";
(() => {
  const C = globalThis.RainyCore;

  /* SMP over Bluetooth: Zephyr's SMP GATT service, raw SMP frames without
   * base64 or CRC (as reverse/tools/rainy75_rgb_ble.py). A request goes out in
   * writes of BLE.CHUNK bytes: Web Bluetooth does not tell the ATT MTU, 20
   * bytes fit the smallest one, and the firmware joins them
   * (CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY). A reply can span several
   * notifications; it is cut by the payload length in its SMP header. */
  const BLE = {
    NAME: "Rainy 75 Pro",
    SERVICE: "8d53dc1d-1db7-4cd3-868b-8a527460aa84",
    CHAR: "da2e7828-fbce-4e01-ae9e-261174997c48",
    CHUNK: 20,
  };
  const BLE_FRAME_MAX = 2048; /* a longer "frame" is noise: start over */

  class BleReassembler {
    constructor() {
      this.buf = new Uint8Array(0);
    }

    reset() {
      this.buf = new Uint8Array(0);
    }

    /* A notification's bytes -> the SMP frames completed by them. */
    push(chunk) {
      const joined = new Uint8Array(this.buf.length + chunk.length);
      joined.set(this.buf);
      joined.set(chunk, this.buf.length);
      this.buf = joined;
      const out = [];
      while (this.buf.length >= 8) {
        const n = 8 + ((this.buf[2] << 8) | this.buf[3]);
        if (n > BLE_FRAME_MAX) {
          this.reset();
          break;
        }
        if (this.buf.length < n) break;
        out.push(this.buf.slice(0, n));
        this.buf = this.buf.slice(n);
      }
      return out;
    }
  }

  function bleChunks(packet, size = BLE.CHUNK) {
    const out = [];
    for (let i = 0; i < packet.length; i += size) out.push(packet.slice(i, i + size));
    return out;
  }

  Object.assign(C, { BLE, BleReassembler, bleChunks });
  // end of Bluetooth transport
})();
</script>
<!-- end of sections -->
