# The config page (web/config/): tested, then published on GitHub Pages
# (https://scholzri.github.io/rainy75-zmk/config/) on pushes to main, and
# attached to every published release as rainy75-config.html. Pages has to be
# enabled once in the repository settings: Pages, Source "GitHub Actions".
name: Config page

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests of the page
        run: node web/config/test-node.mjs
      - name: Size below 100000 bytes
        run: test "$(wc -c < web/config/index.html)" -lt 100000

  deploy:
    if: github.event_name != 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}config/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5

  release-asset:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Attach the page to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp web/config/index.html rainy75-config.html
          gh release upload "$TAG" rainy75-config.html --clobber
